name: Computer Web Server route receiving

on:
  pull_request:
    paths:
      - apps/computer-web-server/src/mount-app.mjs
      - apps/computer-web-server/test/mount-app.test.mjs
      - apps/computer-web-server/package.json
      - .github/workflows/computer-web-server-route-receiving.yml
  push:
    branches: [main]
    paths:
      - apps/computer-web-server/src/mount-app.mjs
      - apps/computer-web-server/test/mount-app.test.mjs
      - apps/computer-web-server/package.json
      - .github/workflows/computer-web-server-route-receiving.yml

permissions:
  contents: read

jobs:
  route-receiving:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Receive mounted-route matching against the actual source
        run: node --test apps/computer-web-server/test/mount-app.test.mjs
