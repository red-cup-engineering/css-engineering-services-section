name: Promotional books upstream
on:
  pull_request:
    paths:
      - "services/web-platform-services-section/services/web2-platform-services-section/services/fastmail-services-section/**"
      - "services/web-platform-services-section/services/web2-platform-services-section/services/web2-financial-platform-services-section/services/web2-payment-platform-services-section/services/digital-goods-storefront-services-section/**"
      - ".github/workflows/promotional-books-upstream-ci.yml"
  workflow_dispatch:

jobs:
  mail-and-gift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse the real mail and fulfillment modules
        run: |
          node --check services/web-platform-services-section/services/web2-platform-services-section/services/fastmail-services-section/src/jmap.mjs
          node --check services/web-platform-services-section/services/web2-platform-services-section/services/fastmail-services-section/test/jmap.test.mjs
          node --check services/web-platform-services-section/services/web2-platform-services-section/services/web2-financial-platform-services-section/services/web2-payment-platform-services-section/services/digital-goods-storefront-services-section/src/worker-runtime.mjs
          node --check services/web-platform-services-section/services/web2-platform-services-section/services/web2-financial-platform-services-section/services/web2-payment-platform-services-section/services/digital-goods-storefront-services-section/test/worker-runtime.test.mjs
      - name: JMAP real client regression suite with isolated credential custody
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-mocks
          cat > .ci-mocks/loader.mjs <<'EOF'
          export async function resolve(specifier, context, nextResolve) {
            if (specifier === "@red-cup-engineering/credential-custody-service/keep")
              return { url: new URL("credential-custody.mjs", import.meta.url).href, shortCircuit: true };
            return nextResolve(specifier, context);
          }
          EOF
          cat > .ci-mocks/credential-custody.mjs <<'EOF'
          import { join } from "node:path";
          export function credentialPath(name, env = process.env) { return join(env.CREDENTIALS_DIRECTORY ?? "/unconfigured-ci", name); }
          export async function keepCredential() { throw Error("tests must hold credentials in their temporary directory"); }
          EOF
          node --experimental-loader ./.ci-mocks/loader.mjs --test services/web-platform-services-section/services/web2-platform-services-section/services/fastmail-services-section/test/jmap.test.mjs
          rm -rf .ci-mocks
