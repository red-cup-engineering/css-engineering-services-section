name: test and scheduled production

# Reusable workflow template for any channel consuming
# @red-cup-engineering/youtube-channel-production-services-section. A
# consuming channel copies this file into its own .github/workflows/ and
# fills in the three placeholder secret names and its own cron, or calls
# it with `workflow_call` if its repository allows cross-repo reusable
# workflows. `secrets.CHANNEL_OAUTH_CLIENT_ID` /
# `CHANNEL_OAUTH_CLIENT_SECRET` / `CHANNEL_REFRESH_TOKEN` must be renamed;
# the production container also needs the org's inference-provider keys
# (API_KEY_GROQ, API_KEY_GOOGLE_GEMINI, API_KEY_OPENROUTER) and the narration
# pair (CLOUDFLARE_ACCOUNT_ID, API_KEY_CLOUDFLARE_WORKERS_AI) as repository
# secrets, forwarded below
# to the exact secret names the channel's spec.secrets declares.
#
# The consuming channel's package.json must carry
# `@red-cup-engineering/check-youtube-channel-repository-form-service` as
# an exact-pinned devDependency (installed by `npm ci` below) so the
# `npx --no-install` gate step can resolve it.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Replace with the channel's own cadence.releaseHourUtc/weekdays.
    - cron: "37 5 * * 2,4,6"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24.18.0 }
      - run: npm ci --ignore-scripts
      - name: check-youtube-channel-repository-form
        run: |
          node -e '
            const fs = require("node:fs");
            function walk(dir, base) {
              const out = [];
              for (const name of fs.readdirSync(dir)) {
                if (name === "node_modules" || name === ".git") continue;
                const rel = base ? `${base}/${name}` : name;
                const abs = `${dir}/${name}`;
                if (fs.statSync(abs).isDirectory()) { out.push(`${rel}/`); out.push(...walk(abs, rel)); }
                else out.push(rel);
              }
              return out;
            }
            let packageJson = {};
            try { packageJson = JSON.parse(fs.readFileSync("package.json", "utf8")); } catch {}
            process.stdout.write(JSON.stringify({ path: ".", entries: walk(".", ""), packageJson }) + "\n");
          ' | npx --no-install check-youtube-channel-repository-form | tee channel-repository-form.json
          grep -q "\"conformant\":true" channel-repository-form.json
      - run: npm test

  production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: channel-scheduled-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: automation-state, path: .channel-state, persist-credentials: false }
      - run: docker build --tag "channel:${GITHUB_SHA}" .
      - run: >-
          docker run --rm
          --env CHANNEL_STATE_ROOT=/state --env CHANNEL_WORK_ROOT=/work
          --env CHANNEL_OAUTH_CLIENT_ID --env CHANNEL_OAUTH_CLIENT_SECRET --env CHANNEL_REFRESH_TOKEN
          --env API_KEY_GROQ --env API_KEY_GOOGLE_GEMINI --env API_KEY_OPENROUTER
          --env CLOUDFLARE_ACCOUNT_ID --env API_KEY_CLOUDFLARE_WORKERS_AI
          --volume "$PWD/.channel-state/state:/state"
          --volume "$RUNNER_TEMP/channel-work:/work"
          "channel:${GITHUB_SHA}"
        env:
          CHANNEL_OAUTH_CLIENT_ID: ${{ secrets.CHANNEL_OAUTH_CLIENT_ID }}
          CHANNEL_OAUTH_CLIENT_SECRET: ${{ secrets.CHANNEL_OAUTH_CLIENT_SECRET }}
          CHANNEL_REFRESH_TOKEN: ${{ secrets.CHANNEL_REFRESH_TOKEN }}
          API_KEY_GROQ: ${{ secrets.API_KEY_GROQ }}
          API_KEY_GOOGLE_GEMINI: ${{ secrets.API_KEY_GOOGLE_GEMINI }}
          API_KEY_OPENROUTER: ${{ secrets.API_KEY_OPENROUTER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_KEY_CLOUDFLARE_WORKERS_AI: ${{ secrets.API_KEY_CLOUDFLARE_WORKERS_AI }}
      - run: |
          gh auth setup-git
          git -C .channel-state config user.name github-actions[bot]
          git -C .channel-state config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C .channel-state add -A
          git -C .channel-state diff --cached --quiet || git -C .channel-state commit -m "Record channel production state"
          git -C .channel-state push origin HEAD:automation-state
        env:
          GH_TOKEN: ${{ github.token }}
